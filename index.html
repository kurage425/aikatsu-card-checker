<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アイカツ！アンコール 1弾 カードチェックリスト</title>
<style>
:root{--bg:#fff7fc;--panel:#fff;--text:#49384f;--muted:#8b7c91;--accent:#b37be8;--accent2:#ff83b7;--line:#eadcf0;--owned:#fff0f8;--shadow:0 10px 30px #8e5b9c1c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7fb,#f5f0ff);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{padding:28px 16px;text-align:center;background:linear-gradient(135deg,#ffb5d7,#b9a4f3);color:#fff;box-shadow:var(--shadow)}
h1{margin:0 0 7px;font-size:clamp(24px,6vw,42px)}header p{margin:0}
main{max-width:1180px;margin:auto;padding:18px}.panel{background:#ffffffed;border:1px solid #fff;border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.stat b{display:block;font-size:25px;color:#9b68d0}.stat span{font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--text)}button{cursor:pointer}button:hover{transform:translateY(-1px)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px;transition:.15s}.card:hover{transform:translateY(-2px)}.card.owned{border-color:#ff9bc5;background:var(--owned)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}.badge{font-size:11px;padding:4px 7px;border-radius:8px;background:#f0e7f8;color:#7955a2}.badge.PR{background:#fff0a8;color:#8c6410}.badge.ER{background:#dff7ff;color:#35738a}.badge.R{background:#eee9ff;color:#7154a8}.badge.N{background:#f2f2f2;color:#777}
.visual{height:175px;border-radius:14px;margin:9px 0;background:radial-gradient(circle at 25% 20%,#fff 0 4%,transparent 5%),linear-gradient(145deg,#ffe0ef,#e7ddff);display:flex;align-items:center;justify-content:center;text-align:center;color:#8c7299;font-weight:800}.visual img{width:100%;height:100%;object-fit:contain;display:block}.visual img{cursor:zoom-in;transition:transform .15s}.visual img:hover{transform:scale(1.02)}.modal{position:fixed;inset:0;background:rgba(35,24,45,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal.open{display:flex}.modal img{max-width:94vw;max-height:90vh;width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 15px 60px rgba(0,0,0,.4);cursor:zoom-out}.modal .close{position:absolute;top:14px;right:18px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#5b4762;font-size:28px;line-height:1;padding:0}.modal .caption{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800}.visual.no-image{background:linear-gradient(135deg,#ffe1ef,#e8ddff);flex-direction:column;gap:5px}.visual .no-image-text{font-size:13px;color:#8b7893}.check{display:flex;align-items:center;gap:8px;font-weight:800;cursor:pointer}.check input{width:19px;height:19px;accent-color:#ff77ad}
.empty{text-align:center;padding:45px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.7}.official{display:inline-block;margin-top:8px;color:#8051b0;font-weight:700}
@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.visual{height:145px}}
.image-guide{margin-top:14px;padding:12px 14px;background:#fff7fc;border:1px dashed #d9bfe5;border-radius:14px;font-size:13px;line-height:1.7}.image-guide code{background:#f0e8f5;padding:2px 5px;border-radius:5px}
.modal .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:52px;height:72px;border:0;border-radius:16px;background:#ffffffdd;color:#6d5680;font-size:48px;line-height:1;cursor:pointer;box-shadow:0 5px 20px #0002}.modal .prev{left:18px}.modal .next{right:18px}.modal-content{position:relative;max-width:90vw;max-height:92vh;display:flex;flex-direction:column;align-items:center}.modal-content #modalImage{max-width:90vw;max-height:82vh;object-fit:contain}.modal .caption{margin-top:8px}.modal .close{z-index:6}
@media(max-width:700px){.modal .nav{width:44px;height:58px;font-size:38px}.modal .prev{left:6px}.modal .next{right:6px}.modal-content #modalImage{max-width:78vw;max-height:78vh}}
</style>
</head>
<body>
<header><h1>✦ アイカツ！アンコール ✦</h1><p>1弾 カードコレクション チェックリスト</p></header>
<main>
<section class="panel"><div class="stats">
<div class="stat"><b id="owned">0</b><span>所持枚数</span></div><div class="stat"><b id="total">85</b><span>全カード</span></div><div class="stat"><b id="missing">85</b><span>未所持</span></div><div class="stat"><b id="percent">0%</b><span>コンプ率</span></div>
</div></section>
<section class="panel">
<div class="controls"><input id="search" placeholder="カード番号を検索（例：E1-30）"><select id="rarity"><option value="">レアリティ：すべて</option><option value="PR">PR</option><option value="R">R</option><option value="N">N</option><option value="ER">ER</option></select><select id="status"><option value="">表示：すべて</option><option value="owned">所持のみ</option><option value="missing">未所持のみ</option></select><select id="sort"><option value="number">番号順</option><option value="rarity">レアリティ順</option></select></div>
<div class="btns"><button class="primary" id="all">全部表示</button><button id="missingBtn">未所持だけ</button><button id="ownedBtn">所持だけ</button><button id="export">チェックを保存</button><button id="importBtn">保存データを読み込む</button><button id="reset">全部リセット</button></div>
<input id="file" type="file" accept="application/json" hidden>
</section>
<section class="panel"><div id="grid" class="grid"></div><p class="note">チェック状態はこのブラウザに自動保存されます。「チェックを保存」ではJSONファイルにもバックアップできます。別のPC・スマホへ移すときはそのファイルを読み込めます。</p><div class="image-guide"><b>🖼️ カード画像の入れ方</b><br>このHTMLと同じ場所に <code>images</code> フォルダを作って、<code>E1-01.jpg</code> ～ <code>E1-85.jpg</code> のようにカード番号と同じ名前で画像を入れてください。PNGやWebPにも対応しています。</div><a class="official" href="https://dcd.aikatsu.com/encore/cardlist/?display=1&search=true&series=629001&sort=1" target="_blank" rel="noopener">公式カードリストを見る ↗</a></section>
</main>
<div class="modal" id="imageModal" aria-hidden="true"><button class="nav prev" id="prevBtn" aria-label="前のカード">‹</button><div class="modal-content"><button class="close" id="modalClose" aria-label="閉じる">×</button><img id="modalImage" alt=""><div class="caption" id="modalCaption"></div></div><button class="nav next" id="nextBtn" aria-label="次のカード">›</button></div>
<script>
const raw=`E1-01_PR E1-02_PR E1-03_PR E1-04_PR E1-05_R E1-06_R E1-07_R E1-08_R E1-09_R E1-10_R E1-11_R E1-12_R E1-13_R E1-14_R E1-15_R E1-16_R E1-17_R E1-18_R E1-19_R E1-20_R E1-21_N E1-22_N E1-23_N E1-24_N E1-25_N E1-26_N E1-27_N E1-28_N E1-29_N E1-30_ER E1-31_ER E1-32_ER E1-33_PR E1-34_PR E1-35_PR E1-36_PR E1-37_R E1-38_R E1-39_R E1-40_R E1-41_N E1-42_N E1-43_N E1-44_N E1-45_N E1-46_N E1-47_N E1-48_N E1-49_N E1-50_ER E1-51_PR E1-52_PR E1-53_R E1-54_R E1-55_R E1-56_R E1-57_R E1-58_R E1-59_R E1-60_N E1-61_N E1-62_N E1-63_N E1-64_N E1-65_N E1-66_N E1-67_N E1-68_N E1-69_N E1-70_N E1-71_PR E1-72_PR E1-73_PR E1-74_PR E1-75_PR E1-76_PR E1-77_PR E1-78_PR E1-79_PR E1-80_PR E1-81_PR E1-82_PR E1-83_N E1-84_N E1-85_N`.split(' ');
const cards=raw.map(id=>{let [number,rarity]=id.split('_');return{id,number,rarity}});
const KEY='aikatsu-encore-e1-owned-v1';let owned=JSON.parse(localStorage.getItem(KEY)||'{}');
const $=id=>document.getElementById(id);const grid=$('grid');
function save(){localStorage.setItem(KEY,JSON.stringify(owned));render()}
function list(){let q=$('search').value.trim().toLowerCase(),r=$('rarity').value,s=$('status').value,sort=$('sort').value;let a=cards.filter(c=>(!q||c.id.toLowerCase().includes(q))&&(!r||c.rarity===r)&&(!s||(s==='owned'?!!owned[c.id]:!owned[c.id])));if(sort==='rarity'){let order={ER:0,PR:1,R:2,N:3};a.sort((x,y)=>order[x.rarity]-order[y.rarity]||x.number.localeCompare(y.number))}return a}
function render(){let a=list();grid.innerHTML=a.length?a.map(c=>`<article class="card ${owned[c.id]?'owned':''}"><div class="top"><span>${c.number}</span><span class="badge ${c.rarity}">${c.rarity}</span></div><div class="visual" data-card="${c.number}"><img src="${c.number}.jpg" alt="${c.number}" loading="lazy" onerror="this.onerror=null;this.src='${c.number}.png';this.dataset.fallback='png';"></div><label class="check"><input type="checkbox" data-id="${c.id}" ${owned[c.id]?'checked':''}> 持ってる</label></article>`).join(''):'<div class="empty">条件に合うカードがありません。</div>';grid.querySelectorAll('.visual img').forEach(img=>img.addEventListener('error',()=>{if(img.dataset.fallback==='png'){img.onerror=null;img.src=img.src.replace(/\.png$/i,'.webp');img.dataset.fallback='webp'}else if(img.dataset.fallback==='webp'){img.parentElement.classList.add('no-image');img.remove();img.parentElement.insertAdjacentHTML('beforeend','<span class="no-image-text">画像を入れてね♡<br>'+img.alt+'</span>')}}));
grid.querySelectorAll('.visual img').forEach(img=>img.addEventListener('click',e=>{e.stopPropagation();$('modalImage').src=img.src;$('modalImage').alt=img.alt;$('modalCaption').textContent=img.alt;$('imageModal').classList.add('open');$('imageModal').setAttribute('aria-hidden','false')}));
grid.querySelectorAll('input[data-id]').forEach(cb=>cb.addEventListener('change',e=>{if(e.target.checked)owned[e.target.dataset.id]=true;else delete owned[e.target.dataset.id];save()}));let n=cards.filter(c=>owned[c.id]).length;$('owned').textContent=n;$('total').textContent=cards.length;$('missing').textContent=cards.length-n;$('percent').textContent=Math.round(n/cards.length*100)+'%'}
['search','rarity','status','sort'].forEach(id=>$(id).addEventListener('input',render));
$('all').onclick=()=>{$('search').value='';$('rarity').value='';$('status').value='';render()};$('missingBtn').onclick=()=>{$('status').value='missing';render()};$('ownedBtn').onclick=()=>{$('status').value='owned';render()};
$('reset').onclick=()=>{if(confirm('所持チェックを全部リセットしますか？')){owned={};save()}};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'aikatsu-encore-checker',version:1,owned},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aikatsu-encore-check.json';a.click();URL.revokeObjectURL(a.href)};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);owned=x.owned||{};save();alert('チェックデータを読み込みました！')}catch{alert('読み込めないファイルです。')}};rd.readAsText(f);e.target.value=''};
let currentIndex=-1;
function visibleCards(){return list()}
function openModal(index){let a=visibleCards();if(!a.length)return;currentIndex=Math.max(0,Math.min(index,a.length-1));showModalCard()}
function showModalCard(){let a=visibleCards();if(currentIndex<0||currentIndex>=a.length)return;let c=a[currentIndex];let img=$('modalImage');img.src=c.number+'.jpg';img.onerror=function(){this.onerror=null;this.src=c.number+'.png';this.onerror=function(){this.onerror=null;this.src=c.number+'.webp'}};img.alt=c.number;$('modalCaption').textContent=c.number+'  '+c.rarity;$('imageModal').classList.add('open');$('imageModal').setAttribute('aria-hidden','false')}
function closeModal(){$('imageModal').classList.remove('open');$('imageModal').setAttribute('aria-hidden','true');$('modalImage').src='';currentIndex=-1}
function moveModal(delta){let a=visibleCards();if(!a.length)return;currentIndex=(currentIndex+delta+a.length)%a.length;showModalCard()}
$('modalClose').onclick=closeModal;$('prevBtn').onclick=e=>{e.stopPropagation();moveModal(-1)};$('nextBtn').onclick=e=>{e.stopPropagation();moveModal(1)};$('imageModal').onclick=e=>{if(e.target===$('imageModal'))closeModal()};document.addEventListener('keydown',e=>{if(!$('imageModal').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')moveModal(-1);if(e.key==='ArrowRight')moveModal(1)});
// Rebind card image clicks so the clicked card opens at its position in the current filtered/sorted list.
const originalRender=render;
render=function(){originalRender();grid.querySelectorAll('.visual img').forEach(img=>img.addEventListener('click',e=>{e.stopPropagation();let number=img.alt;let a=visibleCards();let idx=a.findIndex(c=>c.number===number);openModal(idx)}))};
render();
</script>
</body></html>
